[project]
name = "codecarto"
version = "0.3.0"
description = "A tool used to analyze and graph source code."
authors = [
    {name = "Quaternion Media", email = "cameron@quaternionmedia.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0.0",
    "networkx>=3.1",
    "numpy>=2.1.3",
    "scipy>=1.7.3",
    "fastapi>=0.70.0",
    "gravis>=0.1.0",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=20.1.0",
    "pydantic>=1.10.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "pymongo>=4.6",
    # The lexicons, the construct vocabulary and the capability registry are
    # YAML. Imported at runtime, so declared rather than arriving through an
    # extra of uvicorn's.
    "pyyaml>=6.0",
    # Cargo.toml and Cargo.lock: tomllib is the standard library from 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
c-parsing = [
    "libclang>=16.0.0",
]
# tree-sitter and its grammars. Nothing in the package imports them; every
# language is read by the parsers under codecarto/services/parsers/.
multilang = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.21",
]
dev = [
    "nox>=2022.11.21",
    "pytest>=7.1.3",
    "pytest-asyncio>=0.20.0",
    "pytest-cov>=2.12.1",
    "pytest-xdist>=2.4.0",
    "pytest-profiling>=1.7.0",
    "black>=23.1.0",
    "flake8>=6.0.0",
    "mkdocs>=1.4.2",
    "mkdocstrings[python]>=0.20.0",
    "mkdocs-material>=9.0.11",
    "mkdocs-exclude>=1.0.2",
    "python-dotenv>=0.19.1",
    "ruff>=0.17.0",
]

[project.scripts]
codecarto = "codecarto.cli:cli"

[project.urls]
Homepage = "https://github.com/QuaternionMedia/codecarto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codecarto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
