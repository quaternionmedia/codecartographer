name: Tests

# The Python suite, and deliberately nothing else.
#
# This repository ships a TypeScript frontend under web/ and a docker-compose
# stack, and neither is installed here. Every test under tests/ is pure Python:
# they exercise the parsers, the services and the routers, and they need no
# browser, no Node toolchain and no container. Installing any of that would
# triple the runtime of every pull request to cover code these tests do not
# touch.
#
# The frontend's suites run in web.yml, triggered on the paths they cover, so a
# Python change is not gated on a browser download.
#
# Not a seed file. The governance workflows beside this one are copied from
# governance/qm/project-seed/ci/, and their copies are not all current: diff
# each against that directory at the pinned submodule rather than trusting the
# "copy verbatim" header it carries. This one is the project's own and is free
# to change.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A second push supersedes the first: nobody reads the result of a run whose
  # commit has already been replaced, and the runner minutes are real.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No submodules: graphbase is private and the runner has no
          # credential for it, and nothing under tests/ imports it (both
          # imports in the package sit behind MONGODB_URI and a try/except).
          submodules: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project and its test extras
        # `uv sync --locked` rather than `uv pip install --system`: it installs
        # exactly what uv.lock pins, and it works in a local run of this
        # workflow as well as on a runner. `--system` targets whatever Python
        # the host calls system, which on a Windows workstation is a read-only
        # store install -- so the step failed locally while passing in CI, and
        # a workflow that only runs in one place is one nobody can check before
        # pushing.
        #
        # `c-parsing` too: without libclang every C test skips, so CI read C
        # through nothing -- and since `uv sync` removes what it was not asked
        # for, a local run of this step uninstalled libclang from the
        # developer's environment, after which C files drew empty.
        run: uv sync --locked --extra dev --extra c-parsing

      - name: Run the suite
        # -q because a passing run says nothing worth one line per test,
        # and a failure prints its own detail regardless.
        run: uv run pytest tests -q
