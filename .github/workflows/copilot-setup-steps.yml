name: "Copilot Setup Steps"

# The environment a Copilot coding agent starts in, made the way AGENTS.md
# says to make it: the lockfile's Python environment with C parsing, the
# frontend's packages and Chromium, and the governance corpus the agent is
# told to read first. Nothing else.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

# One run per branch per workflow. This one only triggers on changes to itself,
# so it rarely fires -- capped for consistency rather than for volume.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # graphbase is private and the runner has no credential for it.
          submodules: false

      - name: Check out the governance submodule only
        run: git submodule update --init --depth 1 governance/qm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the Python environment the lockfile pins
        run: uv sync --locked --extra dev --extra c-parsing

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
